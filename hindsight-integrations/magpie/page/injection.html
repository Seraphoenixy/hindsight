<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hindsight · 宿主注入</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="_magpie/bridge.js"></script>
    <script src="boot.js" defer></script>
  </head>
  <body>
    <main>
      <header class="page-header">
        <div class="brand">
          <div class="brand-row">
            <h1>Hindsight</h1>
          </div>
          <p class="brand-sub">控制 Hindsight 记忆向宿主 Agent 的安装、注入与写回</p>
        </div>
        <div class="header-actions">
          <nav class="tabs" aria-label="插件页面">
            <a class="tab" href="index.html">服务管理</a>
            <a class="tab active" href="injection.html">宿主注入</a>
          </nav>
          <button id="refresh" type="button">刷新状态</button>
        </div>
      </header>

      <section class="card">
        <div class="card-header">
          <h2>全局注入总开关</h2>
          <strong id="injectionStatus" class="pill">正在读取…</strong>
        </div>
        <dl class="meta-grid meta-3">
          <div class="meta-item">
            <dt>作用范围</dt>
            <dd>全部宿主（覆盖各宿主的独立开关）</dd>
          </div>
          <div class="meta-item">
            <dt>配置文件</dt>
            <dd><code id="injectionConfigPath">—</code></dd>
          </div>
          <div class="meta-item">
            <dt>最近检查</dt>
            <dd id="checked">—</dd>
          </div>
        </dl>
        <div class="actions">
          <button id="injectionEnable" class="btn-primary" type="button" disabled>
            开启总开关
          </button>
          <button id="injectionDisable" class="btn-danger" type="button" disabled>
            暂停总开关
          </button>
        </div>
        <p class="note">
          通过更新配置文件中的 <code>disabled</code> 字段控制全局注入状态。每次宿主 hook
          触发时重新读取该配置，修改后下一轮对话生效，无需重启宿主。
        </p>
      </section>

      <section class="card">
        <div class="card-header">
          <h2>各宿主接入与注入管理</h2>
          <label class="filter-label">
            <input id="showAllHosts" type="checkbox" />
            显示未检测到的宿主
          </label>
        </div>
        <div id="hostList" class="host-list">
          <p class="note">正在读取宿主状态…</p>
        </div>
        <p class="note">
          安装与卸载会写入或移除对应宿主的 hook 与 MCP 配置；开启与暂停仅更新
          <code>harnesses.&lt;name&gt;.disabled</code>。
        </p>
      </section>

      <div class="status-bar">
        <p id="status" role="status">正在连接 Magpie…</p>
      </div>
    </main>
  </body>
</html>
