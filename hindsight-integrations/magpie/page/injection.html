<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hindsight · 宿主注入</title>
    <script src="_magpie/bridge.js"></script>
    <script src="boot.js" defer></script>
    <style>
      main {
        max-width: 760px;
      }
      .card {
        margin: 18px 0;
        padding: 18px;
        border: 1px solid var(--magpie-line);
        border-radius: 12px;
        background: var(--magpie-card);
      }
      .row {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 10px;
      }
      .row h2 {
        margin: 0;
        flex: 1;
      }
      dl {
        display: grid;
        grid-template-columns: max-content minmax(0, 1fr);
        gap: 10px 18px;
      }
      dt {
        color: var(--magpie-muted);
      }
      dd {
        margin: 0;
        overflow-wrap: anywhere;
      }
      #injectionStatus[data-enabled="true"],
      .badge[data-state="on"] {
        color: var(--magpie-green);
      }
      #injectionStatus[data-enabled="false"],
      .badge[data-state="off"] {
        color: var(--magpie-muted);
      }
      .note {
        color: var(--magpie-muted);
        margin-top: 12px;
      }
      button {
        min-height: 34px;
      }
      .tabs {
        display: flex;
        gap: 8px;
        margin: 14px 0 18px;
      }
      .tab {
        display: inline-flex;
        align-items: center;
        min-height: 34px;
        padding: 0 14px;
        border: 1px solid var(--magpie-line);
        border-radius: 8px;
        color: inherit;
        text-decoration: none;
      }
      .tab.active {
        background: var(--magpie-card);
        font-weight: 600;
      }
      .host-list {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-top: 14px;
      }
      .host-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 10px;
        padding: 12px;
        border: 1px solid var(--magpie-line);
        border-radius: 8px;
      }
      .host-meta {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .host-title {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 8px;
      }
      .host-actions {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 8px;
      }
      .filter-label {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        color: var(--magpie-muted);
        font-size: 0.92em;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Hindsight</h1>
      <nav class="tabs" aria-label="插件页面">
        <a class="tab" href="index.html">服务管理</a>
        <a class="tab active" href="injection.html">宿主注入</a>
      </nav>
      <p>控制 Hindsight 记忆是否向宿主 Agent 安装、注入与写回</p>
      <section class="card">
        <div class="row">
          <h2>全局注入总开关</h2>
          <strong id="injectionStatus">正在读取…</strong>
        </div>
        <dl>
          <dt>作用范围</dt>
          <dd>全部宿主（覆盖各宿主的独立开关）</dd>
          <dt>配置文件</dt>
          <dd><code id="injectionConfigPath">—</code></dd>
          <dt>最近检查</dt>
          <dd id="checked">—</dd>
        </dl>
        <div class="row">
          <button id="injectionEnable" type="button" disabled>开启总开关</button>
          <button id="injectionDisable" type="button" disabled>暂停总开关</button>
          <button id="refresh" type="button">刷新状态</button>
        </div>
        <p class="note">
          通过更新配置文件中的 <code>disabled</code> 字段控制全局注入状态。每次宿主 hook
          触发时重新读取该配置，修改后下一轮对话生效，无需重启宿主。
        </p>
      </section>
      <section class="card">
        <div class="row">
          <h2>各宿主接入与注入管理</h2>
          <label class="filter-label">
            <input id="showAllHosts" type="checkbox" />
            显示未检测到的宿主
          </label>
        </div>
        <div id="hostList" class="host-list">
          <p class="note">正在读取宿主状态…</p>
        </div>
        <p class="note">
          安装与卸载会写入或移除对应宿主的 hook 与 MCP 配置；开启与暂停仅更新
          <code>harnesses.&lt;name&gt;.disabled</code>。
        </p>
      </section>
      <p id="status" role="status">正在连接 Magpie…</p>
    </main>
  </body>
</html>
