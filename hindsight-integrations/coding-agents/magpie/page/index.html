<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hindsight</title>
    <script src="_magpie/bridge.js"></script>
    <script src="boot.js" defer></script>
    <style>
      main {
        max-width: 760px;
      }
      .card {
        margin: 18px 0;
        padding: 18px;
        border: 1px solid var(--magpie-line);
        border-radius: 12px;
        background: var(--magpie-card);
      }
      .row {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 10px;
      }
      .row h2 {
        margin: 0;
        flex: 1;
      }
      dl {
        display: grid;
        grid-template-columns: max-content minmax(0, 1fr);
        gap: 10px 18px;
      }
      dt {
        color: var(--magpie-muted);
      }
      dd {
        margin: 0;
        overflow-wrap: anywhere;
      }
      #running[data-running="true"] {
        color: var(--magpie-green);
      }
      #running[data-running="false"] {
        color: var(--magpie-muted);
      }
      .note {
        color: var(--magpie-muted);
        margin-top: 12px;
      }
      button {
        min-height: 34px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Hindsight</h1>
      <p>管理界面进程与记忆服务状态</p>
      <section class="card">
        <div class="row">
          <h2>管理界面</h2>
          <strong id="running">正在读取…</strong>
        </div>
        <dl>
          <dt>Profile</dt>
          <dd id="profile">—</dd>
          <dt>端口</dt>
          <dd id="port">—</dd>
          <dt>管理地址</dt>
          <dd><code id="address">—</code></dd>
          <dt>记忆服务</dt>
          <dd id="daemon">—</dd>
          <dt>最近检查</dt>
          <dd id="checked">—</dd>
        </dl>
        <div class="row">
          <button id="start" type="button" disabled>启动</button>
          <button id="stop" type="button" disabled>停止</button>
          <button id="restart" type="button" disabled>重启</button>
          <button id="refresh" type="button">刷新状态</button>
          <button id="open" type="button" disabled>打开管理界面</button>
        </div>
        <p class="note">
          管理界面独立运行，Magpie 退出或重载后仍会保持运行。完整管理界面在系统浏览器中打开。
        </p>
      </section>
      <p id="status" role="status">正在连接 Magpie…</p>
    </main>
  </body>
</html>
